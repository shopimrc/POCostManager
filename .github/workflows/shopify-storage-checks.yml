name: Shopify storage checks
on:
  push:
    branches: [feature/shopify-only-storage]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/shopify-po-storage.test.js
      - run: npm run build
        env:
          SHOPIFY_API_KEY: test_key
          SHOPIFY_API_SECRET: test_secret
          SHOPIFY_APP_URL: https://example.com
          DATABASE_URL: postgresql://test:test@localhost:5432/test
